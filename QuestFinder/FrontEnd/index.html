<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>QuestFinder</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <h1>QuestFinder</h1>
  </header>

  <main>
    <div class="user-bar">
      <label for="userId">Logged in as user ID</label>
      <input id="userId" type="number" placeholder="e.g. 1">
      <button onclick="setUser()">Use this user</button>
      <span id="who"></span>
    </div>

    <div class="nav">
      <button onclick="showView('post')">Post a task</button>
      <button onclick="showView('quests')">Browse quests</button>
      <button onclick="showView('wallet')">Wallet</button>
    </div>

    <div id="message"></div>

    <div id="view-post" class="view-panel" hidden>
      <h2>Post a task</h2>
      <label>Title</label><input id="title">
      <label>Work description</label><textarea id="description" rows="4"></textarea>
      <label>Qualification (skills)</label><input id="skills_required">
      <label>Location</label><input id="location">
      <label>Offered pay (₱)</label><input id="budget" type="number">
      <label>Duration (minutes)</label><input id="duration_minutes" type="number">
      <button onclick="postTask()">Publish task</button>
    </div>

    <div id="view-quests" class="view-panel" hidden>
      <h2>Browse quests</h2>
      <input id="search" placeholder="Search by keyword" onkeyup="loadQuests()">
      <div id="quest-list"></div>
      <div id="quest-detail"></div>
    </div>

    <div id="view-wallet" class="view-panel" hidden>
      <h2>Wallet</h2>
      <div id="balance"></div>
      <h3>Transactions</h3>
      <div id="transactions"></div>
    </div>
  </main>

  <script src="js/script.js"></script>
</body>
</html>
