{#- Bottom tab bar from the prototype: Home · Wallet (₱) · Transaction History · Messages -#}
{% set tab = active_tab|default('') %}
<nav class="tabbar" aria-label="Main">
  <a href="{{ link_to('main.home') }}" class="tab {{ 'active' if tab == 'home' }}" aria-label="Home">
    <svg viewBox="0 0 24 24"><path d="M3 10.5L12 3l9 7.5"/><path d="M5 9.5V21h5v-6h4v6h5V9.5"/></svg>
    <span>Home</span>
  </a>
  <a href="{{ link_to('wallet.index') }}" class="tab {{ 'active' if tab == 'wallet' }}" aria-label="Wallet">
    <span class="peso-icon" aria-hidden="true">₱</span>
    <span>Wallet</span>
  </a>
  <a href="{{ link_to('wallet.history') }}" class="tab {{ 'active' if tab == 'history' }}" aria-label="Transaction history">
    <svg viewBox="0 0 24 24"><path d="M6 2h12v20l-3-2-3 2-3-2-3 2z"/><path d="M9 7h6M9 11h6M9 15h4"/></svg>
    <span>History</span>
  </a>
  <a href="{{ link_to('messages.inbox') }}" class="tab {{ 'active' if tab == 'messages' }}" aria-label="Messages">
    <svg viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20.5l1.4-4.9A8 8 0 1 1 21 12z"/></svg>
    <span>Messages</span>
    {% if unread_messages is defined and unread_messages %}<em class="dot-badge">{{ unread_messages }}</em>{% endif %}
  </a>
</nav>
